
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>FocusFlow</h1>
            <p>Stay focused. Get things done.</p>
        </header>

        <div class="timer-container">
            <p class="timer-label">FOCUS SESSION</p>
            <h2 id="timer">25:00</h2>
            <p id="sessionStatus">Ready to focus?</p>
        </div>

        <div class="controls">
            <button id="startBtn">Start Focus</button>
            <button id="resetBtn">Reset</button>
        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
