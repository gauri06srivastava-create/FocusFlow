
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusFlow</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>FocusFlow</h1>
            <p>Stay focused. Get things done.</p>
        </header>

        <!-- Session Modes -->
        <div class="mode-controls">

            <button class="mode-btn active" data-mode="focus">
                Focus
            </button>

            <button class="mode-btn" data-mode="shortBreak">
                Short Break
            </button>

            <button class="mode-btn" data-mode="longBreak">
                Long Break
            </button>

        </div>

        <!-- Timer Section -->
        <div class="timer-container">

            <p class="timer-label" id="sessionModeLabel">
                FOCUS SESSION
            </p>

            <h2 id="timer">25:00</h2>

            <p id="sessionStatus">Ready to focus?</p>

        </div>

        <!-- Timer Controls -->
        <div class="controls">

            <button id="startBtn">
                Start Focus
            </button>

            <button id="resetBtn">
                Reset
            </button>

        </div>

        <!-- Session Counter -->
        <div class="session-counter">

            <p>Completed Focus Sessions</p>

            <h2 id="completedSessions">0</h2>

        </div>

<!-- Task Manager -->
<section class="task-section">

    <div class="task-header">
        <h2>My Tasks</h2>
        <span id="taskCount">0 Tasks</span>
    </div>

    <!-- Add Task Form -->
    <div class="task-input-container">

        <input
            type="text"
            id="taskInput"
            placeholder="What do you need to do?"
        >

        <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <button id="addTaskBtn">Add</button>

    </div>

    <!-- Task List -->
    <div id="taskList" class="task-list">

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

    </div>

</section>

    </div>

    <script src="popup.js"></script>

</body>

</html>
